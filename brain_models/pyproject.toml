[project]
name = "brain-models"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "brain_models"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
